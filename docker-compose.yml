services:
  api:
    build: .
    container_name: pdn_collector_api
    restart: always
    ports: ["8000:8000"]
    volumes:
      - ./app:/code/app
      - ./logs:/code/logs
    env_file: [.env]
    networks: [pdn_network]
    profiles: ["core", "full"]

  db:
    image: postgres:15
    container_name: pdn_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdn_password}
      POSTGRES_DB: ${POSTGRES_DB:-pdn_collector}
    ports: ["5432:5432"]
    volumes: [pdn_pgdata:/var/lib/postgresql/data]
    networks: [pdn_network]
    profiles: ["core", "full"]

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: pdn_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    ports: ["9187:9187"]
    networks: [pdn_network]
    profiles: ["monitoring", "full"]

  node_exporter:
    image: prom/node-exporter:latest
    container_name: pdn_node_exporter
    restart: always
    ports: ["9100:9100"]
    networks: [pdn_network]
    profiles: ["monitoring", "full"]

  prometheus:
    image: prom/prometheus:latest
    container_name: pdn_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [pdn_network]
    profiles: ["monitoring", "full"]

  grafana:
    image: grafana/grafana:latest
    container_name: pdn_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports: ["3000:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    networks: [pdn_network]
    profiles: ["monitoring", "full"]

networks:
  pdn_network:
    external: true

volumes:
  pdn_pgdata:
  prometheus_data:
  grafana_data: